name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Build
        run: make
      - name: Check Windows 98 compatibility
        run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: NEOFAN
          path: build/NEOFAN.EXE
